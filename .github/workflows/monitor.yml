name: monitor

on:
  workflow_dispatch: {}
  # Add a schedule trigger once you've configured your own Secrets/Variables
  # (see README) — left out here so this template repo doesn't run/fail on
  # its own with no webhook configured.
  # schedule:
  #   - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_THREAD_ID: ${{ secrets.DISCORD_THREAD_ID }}
          ROUTE_FILTERS: ${{ vars.ROUTE_FILTERS }}
          NOTIFY_TARGETS: ${{ vars.NOTIFY_TARGETS }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/run_log.jsonl data/route_history.json
          git diff --cached --quiet || git commit -m "chore: update state.json / run_log.jsonl / route_history.json"
          git push
