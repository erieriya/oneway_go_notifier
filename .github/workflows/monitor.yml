name: monitor

on:
  workflow_dispatch: {}
  # Add a schedule trigger once you've configured your own Secrets/Variables
  # (see README) — left out here so this template repo doesn't run/fail on
  # its own with no webhook configured.
  # schedule:
  #   - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_THREAD_ID: ${{ secrets.DISCORD_THREAD_ID }}
          ROUTE_FILTERS: ${{ vars.ROUTE_FILTERS }}
          NOTIFY_TARGETS: ${{ vars.NOTIFY_TARGETS }}
        run: python monitor.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/run_log.jsonl data/route_history.json
          if [ -f data/notify_failures.jsonl ]; then
            git add data/notify_failures.jsonl
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update state.json / run_log.jsonl / route_history.json"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i), rebasing onto latest main and retrying..."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "Rebase conflict, giving up on this run's commit (next run will still reflect current state)"
              exit 0
            fi
          done
          echo "Push failed after retries, giving up on this run's commit (next run will still reflect current state)"
